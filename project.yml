name: OpenCommander
options:
  bundleIdPrefix: org.opencommander
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
packages:
  OpenCommanderCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OpenCommander:
    type: application
    platform: macOS
    sources:
      - path: OpenCommander
        excludes:
          - Info.plist
    dependencies:
      - package: OpenCommanderCore
        product: OpenCommanderCore
      - package: OpenCommanderCore
        product: OpenCommanderRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opencommander.OpenCommander
        INFOPLIST_FILE: OpenCommander/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  OpenCommander:
    build:
      targets:
        OpenCommander: all
    run:
      config: Debug

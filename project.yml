name: OpenCommander
options:
  bundleIdPrefix: org.opencommander
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
packages:
  OpenCommanderCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OpenCommander:
    type: application
    platform: macOS
    sources:
      - path: OpenCommander
        excludes:
          - Info.plist
    dependencies:
      - package: OpenCommanderCore
        product: OpenCommanderCore
      - package: OpenCommanderCore
        product: OpenCommanderRemote
    postBuildScripts:
      - name: Wersja z gita
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Wpisuje do zbudowanego Info.plist skrót commita (+ liczbę commitów i znacznik zmian lokalnych), by wersja w menu Pomoc zgadzała się z historią git.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          cd "${SRCROOT}"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            HASH=$(git rev-parse --short=7 HEAD)
            COUNT=$(git rev-list --count HEAD)
            [ -n "$(git status --porcelain --untracked-files=no)" ] && HASH="${HASH}+zmiany"
          else
            HASH="bez-git"; COUNT="0"
          fi
          /usr/libexec/PlistBuddy -c "Delete :OCGitCommit" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :OCGitCommit string ${HASH}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :OCGitCount" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :OCGitCount string ${COUNT}" "$PLIST"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: org.opencommander.OpenCommander
        INFOPLIST_FILE: OpenCommander/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OpenCommander/OpenCommander.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  OpenCommander:
    build:
      targets:
        OpenCommander: all
    run:
      config: Debug
